<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Control de Asistencia · Salesland</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar" id="topbar">
    <div class="brand brand-small">
      <span class="brand-sales">SALES</span><span class="brand-land">LAND</span>
      <span class="brand-tagline">Control de Asistencia</span>
    </div>
    <div class="topbar-right">
      <!-- Ahora el contador es un botón: al tocarlo se abre el pop-up con la lista de asistentes -->
      <button id="btn-attendance" class="counter" type="button">0 registrados</button>
      <button id="btn-logout" class="link-btn">Cambiar usuario</button>
    </div>
  </header>

  <div class="operator-bar" id="operator-bar" hidden>
    Controlando ingreso: <b id="operator-name"></b>
  </div>

  <main id="main-content">
    <section class="scanner-card">
      <div id="reader"></div>
      <div class="scanner-controls">
        <button id="btn-toggle-camera" class="btn secondary">🔄 Cambiar cámara</button>
        <button id="btn-torch" class="btn secondary" hidden>🔦 Linterna</button>
      </div>
    </section>

    <section class="result-card" id="result-card" hidden>
      <div class="result-icon" id="result-icon"></div>
      <div class="result-info">
        <p class="result-title" id="result-title"></p>
        <dl class="result-fields" id="result-fields"></dl>
      </div>
    </section>

    <section class="status-bar">
      <span id="conn-status" class="pill">● en línea</span>
      <span id="queue-status" class="pill" hidden></span>
    </section>

    <section class="history">
      <h2>Últimos escaneados</h2>
      <ul id="history-list"></ul>
    </section>
  </main>

  <!-- Pop-up de inicio de sesión: identifica quién está controlando el ingreso -->
  <div id="login-modal" class="modal-overlay login-overlay">
    <div class="modal-card login-card">
      <div class="brand">
        <span class="brand-sales">SALES</span><span class="brand-land">LAND</span>
      </div>
      <p class="login-subtitle">Control de Asistencia</p>

      <label class="field-label" for="login-nombre">Nombre completo</label>
      <input id="login-nombre" class="field-input" type="text" placeholder="Nombre y apellido" autocomplete="off" />

      <label class="field-label" for="login-dni">DNI</label>
      <input id="login-dni" class="field-input" type="text" inputmode="numeric" placeholder="Ej. 12345678" autocomplete="off" />

      <button id="btn-login" class="btn primary full">Ingresar</button>
      <p id="login-error" class="login-error" hidden>Completa tu nombre y DNI para continuar.</p>
    </div>
  </div>

  <!-- Pop-up con la lista de personas ya escaneadas -->
  <div id="attendance-modal" class="modal-overlay attendance-overlay" hidden>
    <div class="modal-card attendance-card">
      <div class="modal-header">
        <h2>Asistentes registrados</h2>
        <button id="btn-close-attendance" class="modal-close" type="button" aria-label="Cerrar">✕</button>
      </div>

      <input id="attendance-search" class="field-input" type="text" placeholder="Buscar por nombre, DNI, coordinador o campaña" autocomplete="off" />

      <p id="attendance-loading" class="attendance-status" hidden>Cargando...</p>
      <p id="attendance-empty" class="attendance-status" hidden>No se encontraron resultados.</p>
      <ul id="attendance-list" class="attendance-list"></ul>
    </div>
  </div>

  <!-- Supabase client (UMD build) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- Librería de escaneo QR usando la cámara -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
